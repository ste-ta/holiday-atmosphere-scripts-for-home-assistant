name: Home Assistant regression checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scripts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: '3.13'
            homeassistant: '2025.1.4'
          - python: '3.14'
            homeassistant: '2026.10.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "homeassistant==${{ matrix.homeassistant }}" "pytest==8.3.4" "pytest-asyncio==0.25.2"
      - run: python tools/build_blueprint.py --check
      - run: python -m pytest -q
