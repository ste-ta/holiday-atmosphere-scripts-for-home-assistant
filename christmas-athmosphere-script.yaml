alias: 🎄 Christmas Atmosphere
description: v2.1.0 Christmas entry point; requires the shared holiday package. One active show globally.
mode: parallel
max: 20
fields:
  lights:
    description: Light entity IDs or light groups; required when starting, optional for stop.
    example: light.living_room, light.hallway, light.kitchen
    selector:
      entity:
        multiple: true
        domain: light
  effect:
    description: Which effect to play
    example: xmas_tree
    selector:
      select:
        options:
        - xmas_tree
        - xmas_snowfall
        - xmas_fireplace
        - xmas_santa
        - xmas_dinner
        - xmas_party
        - stop
    required: true
  brightness_max:
    name: Brightness ceiling
    description: Maximum effect brightness (1–255); restoration is not capped.
    default: 255
    selector:
      number:
        min: 1
        max: 255
        step: 1
        mode: slider
  speed:
    name: Effect speed
    description: Ambient holds and transitions are divided by this factor; pacing and timestamp countdowns
      stay fixed.
    default: 1
    selector:
      number:
        min: 0.25
        max: 4
        step: 0.25
        mode: slider
  duration:
    name: Duration
    description: Maximum running time in seconds; 0 means unlimited (finite effects still finish).
    default: 0
    selector:
      number:
        min: 0
        max: 86400
        step: 1
        unit_of_measurement: s
        mode: box
  pacing:
    name: Command pacing
    description: 'Minimum delay after each action: conservative 1000 ms, balanced 250 ms, fast 100 ms.
      Hardware reliability must be tested.'
    default: balanced
    selector:
      select:
        options:
        - conservative
        - balanced
        - fast
  gentle:
    name: Gentle mode
    description: Reject flashing effects. Choose an ambient effect.
    default: false
    selector:
      boolean: {}
  restore_on_stop:
    name: Restore on completion
    description: Automatic completion restores the original scene when true. Pass false with stop to deliberately
      discard the backup.
    default: true
    selector:
      boolean: {}
  group_updates:
    name: Send frames together
    description: Send one shared frame to all available bulbs. Integration fan-out may still introduce
      skew; not a guarantee of Zigbee groupcast.
    default: false
    selector:
      boolean: {}
sequence:
- if: '{{ effect | default('''') not in [''xmas_tree'', ''xmas_snowfall'', ''xmas_fireplace'', ''xmas_santa'',
    ''xmas_dinner'', ''xmas_party'', ''stop''] }}'
  then:
  - stop: Choose an effect from this holiday’s menu
    error: true
- action: script.holiday_atmosphere_controller
  data:
    effect: '{{ effect }}'
    lights: '{{ lights | default([]) }}'
    brightness_max: '{{ brightness_max | default(255) }}'
    speed: '{{ speed | default(1) }}'
    duration: '{{ duration | default(0) }}'
    pacing: '{{ pacing | default(''balanced'') }}'
    gentle: '{{ gentle | default(false) }}'
    restore_on_stop: '{{ restore_on_stop | default(true) }}'
    group_updates: '{{ group_updates | default(false) }}'
