alias: Holiday Atmosphere Light Step
description: Internal paced, bounded, best-effort color update (v2.1.0).
mode: single
sequence:
  - variables:
      available: >-
        {% set ns = namespace(lights=[]) %}
        {% for entity in targets %}
          {% if states(entity) not in ['unknown', 'unavailable'] %}
            {% set ns.lights = ns.lights + [entity] %}
          {% endif %}
        {% endfor %}
        {{ ns.lights }}
      send_frame: "{{ available | length > 0 and (deadline == 0 or as_timestamp(now()) < deadline) }}"
  - if: "{{ send_frame }}"
    then:
      - action: light.turn_on
        continue_on_error: true
        target:
          entity_id: "{{ available }}"
        data:
          brightness: "{{ [[brightness | int, brightness_max | int] | min, 1] | max }}"
          xy_color: "{{ color }}"
          transition: "{{ transition / speed }}"
  # Always yield, even if every bulb became unavailable. Speed cannot bypass pacing.
  - delay:
      milliseconds: "{{ interval_ms if send_frame or deadline == 0 or as_timestamp(now()) < deadline else 1 }}"
