# Generated by tools/build_package.py; edit the source scripts.
input_text:
  holiday_atmosphere_session:
    name: Holiday Atmosphere Session
    max: 255
    initial: '{}'
script:
  holiday_atmosphere_controller:
    alias: Holiday Atmosphere Controller
    description: Serializes show requests and owns the original lighting snapshot (v2.1.0).
    mode: queued
    max: 20
    sequence:
    - variables:
        effect_name: '{{ effect | default(''stop'') }}'
        requested_lights: '{% set value = lights | default([]) %} {{ ([value] if value is string else
          value) if value is string or (value is sequence and value is not mapping) else [] }}'
        ceiling: '{{ brightness_max | default(255) }}'
        speed_value: '{{ speed | default(1) }}'
        duration_value: '{{ duration | default(0) }}'
        profile: '{{ pacing | default(''balanced'') }}'
        gentle_value: '{{ gentle | default(false) }}'
        restore_value: '{{ restore_on_stop | default(true) }}'
        group_value: '{{ group_updates | default(false) }}'
        countdown_value: '{{ countdown_seconds | default(10) }}'
        target_value: '{{ countdown_target | default('''') }}'
        backup: scene.holiday_atmosphere_backup
        session_helper: input_text.holiday_atmosphere_session
        session: '{{ states(session_helper) | from_json if states(session_helper) not in [''unknown'',
          ''unavailable'', ''''] else {} }}'
        allowed_effects:
        - hell
        - lightning
        - graveyard
        - halloween
        - blood
        - xmas_tree
        - xmas_snowfall
        - xmas_fireplace
        - xmas_santa
        - xmas_dinner
        - xmas_party
        - nye_countdown
        - nye_confetti
        - nye_midnight_flash
        - nye_sparkler
        - nye_champagne
        - stop
        flashing_effects:
        - lightning
        - blood
        - xmas_party
        - nye_countdown
        - nye_confetti
        - nye_midnight_flash
        - nye_sparkler
    - if: '{{ expected_session | default('''') != '''' and expected_session != session.get(''token'',
        '''') }}'
      then:
      - stop: Obsolete completion request ignored
    - if: '{{ effect_name not in allowed_effects }}'
      then:
      - stop: Unknown holiday effect
        error: true
    - if: '{{ states(session_helper) in [''unknown'', ''unavailable''] }}'
      then:
      - stop: Install input_text.holiday_atmosphere_session before running the show
        error: true
    - if: '{{ restore_value is not boolean }}'
      then:
      - stop: restore_on_stop must be a boolean
        error: true
    - if: '{{ effect_name != ''stop'' }}'
      then:
      - if: |-
          {{ requested_lights | length == 0 or
             requested_lights | select('string') | list | length != requested_lights | length or
             requested_lights | select('match', '^light\\.[a-z0-9_]+$') | list | length != requested_lights | length }}
        then:
        - stop: Supply a nonempty list of light entity IDs (or one light entity ID)
          error: true
      - if: |-
          {{ ceiling is boolean or ceiling is not number or not is_number(ceiling) or ceiling != ceiling | int or ceiling < 1 or ceiling > 255 or
             speed_value is boolean or speed_value is not number or not is_number(speed_value) or speed_value < 0.25 or speed_value > 4 or
             duration_value is boolean or duration_value is not number or not is_number(duration_value) or duration_value < 0 or duration_value > 86400 or
             countdown_value is boolean or countdown_value is not number or not is_number(countdown_value) or countdown_value < 1 or countdown_value > 86400 or
             profile not in ['conservative', 'balanced', 'fast'] or
             gentle_value is not boolean or group_value is not boolean }}
        then:
        - stop: Invalid brightness, speed, duration, countdown, pacing, or boolean control
          error: true
      - if: '{{ gentle_value and effect_name in flashing_effects }}'
        then:
        - stop: Gentle mode excludes flashing effects; choose an ambient effect
          error: true
      - if: |-
          {{ target_value is not string or
             (target_value != '' and (effect_name != 'nye_countdown' or
              as_datetime(target_value, none) is none or as_datetime(target_value).tzinfo is none or as_timestamp(target_value, 0) <= as_timestamp(now()))) }}
        then:
        - stop: countdown_target must be a future timestamp and is only valid for nye_countdown
          error: true
    - variables:
        lights_list: '{{ expand(requested_lights) | map(attribute=''entity_id'') | unique | sort | list
          if effect_name != ''stop'' else [] }}'
    - if: '{{ effect_name != ''stop'' }}'
      then:
      - if: |-
          {% set ns = namespace(invalid=false) %} {% for entity in requested_lights %}
            {% if states(entity) == 'unknown' %}{% set ns.invalid = true %}{% endif %}
          {% endfor %} {{ ns.invalid or lights_list | length == 0 }}
        then:
        - stop: A requested light does not exist or the group is empty
          error: true
    - variables:
        available_lights: |-
          {% set ns = namespace(lights=[]) %} {% for entity in lights_list %}
            {% if states(entity) not in ['unknown', 'unavailable'] %}
              {% set ns.lights = ns.lights + [entity] %}
            {% endif %}
          {% endfor %} {{ ns.lights }}
    - if: '{{ effect_name != ''stop'' }}'
      then:
      - if: '{{ available_lights | length == 0 }}'
        then:
        - stop: No selected lights are available
          error: true
      - if: |-
          {% set ns = namespace(invalid=false) %} {% for entity in available_lights %}
            {% set modes = state_attr(entity, 'supported_color_modes') or [] %}
            {% if not (modes | select('in', ['xy', 'hs', 'rgb', 'rgbw', 'rgbww']) | list) %}
              {% set ns.invalid = true %}
            {% endif %}
          {% endfor %} {{ ns.invalid }}
        then:
        - stop: Selected available lights must support color
          error: true
    - variables:
        previous_lights: '{{ state_attr(backup, ''entity_id'') or [] }}'
        targets_changed: '{{ effect_name != ''stop'' and previous_lights | sort != lights_list | sort
          }}'
    - action: script.turn_off
      target:
        entity_id: script.holiday_atmosphere_runner
    - if: '{{ previous_lights | length > 0 and (effect_name == ''stop'' or targets_changed) }}'
      then:
      - if: '{{ effect_name != ''stop'' or restore_value }}'
        then:
        - if: |-
            {% set ns = namespace(unavailable=false) %} {% for entity in previous_lights %}
              {% if states(entity) in ['unknown', 'unavailable'] %}{% set ns.unavailable = true %}{% endif %}
            {% endfor %} {{ ns.unavailable }}
          then:
          - stop: Restoration deferred because a saved light is unavailable; backup retained, retry stop
              later
            error: true
        - action: scene.turn_on
          target:
            entity_id: '{{ backup }}'
          data:
            transition: 1
        - delay: 1
      - action: scene.delete
        target:
          entity_id: '{{ backup }}'
    - if: '{{ effect_name == ''stop'' }}'
      then:
      - action: input_text.set_value
        target:
          entity_id: '{{ session_helper }}'
        data:
          value: '{}'
      - stop: Holiday show stopped
    - if: '{{ state_attr(backup, ''entity_id'') is none }}'
      then:
      - action: scene.create
        data:
          scene_id: holiday_atmosphere_backup
          snapshot_entities: '{{ available_lights }}'
      - if: '{{ state_attr(backup, ''entity_id'') | default([], true) | sort != available_lights | sort
          }}'
        then:
        - stop: Original scene could not be captured; refusing to start the show
          error: true
    - variables:
        token: '{{ context.id ~ ''-'' ~ now().strftime(''%Y%m%d%H%M%S%f'') ~ ''-'' ~ (range(10000,99999)
          | random) }}'
    - action: input_text.set_value
      target:
        entity_id: '{{ session_helper }}'
      data:
        value: '{{ {''token'': token, ''restore'': restore_value} | to_json }}'
    - action: script.turn_on
      target:
        entity_id: script.holiday_atmosphere_runner
      data:
        variables:
          lights: '{{ available_lights }}'
          effect: '{{ effect_name }}'
          brightness_max: '{{ ceiling }}'
          speed: '{{ speed_value }}'
          duration: '{{ duration_value }}'
          pacing: '{{ profile }}'
          group_updates: '{{ group_value }}'
          countdown_seconds: '{{ countdown_value }}'
          countdown_target: '{{ target_value }}'
          session_token: '{{ token }}'
          restore_on_stop: '{{ restore_value }}'
  holiday_atmosphere_runner:
    alias: Holiday Atmosphere Runner
    description: Internal shared frame engine; use a holiday entry point (v2.1.0).
    mode: single
    sequence:
    - variables:
        started: '{{ as_timestamp(now()) }}'
        interval_ms: '{{ {''conservative'': 1000, ''balanced'': 250, ''fast'': 100}[pacing] }}'
        countdown_length: '{{ as_timestamp(countdown_target) - started if countdown_target != '''' else
          countdown_seconds }}'
        deadline: '{% set limits = [] %} {% if duration > 0 %}{% set limits = limits + [started + duration]
          %}{% endif %} {% if effect == ''nye_countdown'' %}{% set limits = limits + [started + countdown_length]
          %}{% endif %} {{ limits | min if limits else 0 }}'
        palettes:
          hell:
            colors:
            - - 0.7006
