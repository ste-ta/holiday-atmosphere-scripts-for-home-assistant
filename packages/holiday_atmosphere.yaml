        selector:
          entity:
            multiple: true
            domain: light
      effect:
        description: Which effect to play
        example: nye_countdown
        selector:
          select:
            options:
            - nye_countdown
            - nye_confetti
            - nye_midnight_flash
            - nye_sparkler
            - nye_champagne
            - stop
        required: true
      brightness_max:
        name: Brightness ceiling
