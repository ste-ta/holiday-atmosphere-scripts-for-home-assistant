    - repeat:
        while: |-
          {{ (deadline == 0 or as_timestamp(now()) < deadline) and
             (effect != 'nye_countdown' or repeat.index <= 10) and
             (effect != 'nye_midnight_flash' or repeat.index <= 1) }}
        sequence:
        - variables:
            cycle_index: '{{ repeat.index }}'
            frames: |-
              {% set white = [[0.3227, 0.329]] %} {% set red = [[0.675, 0.322], [0.7006, 0.2993], [0.685, 0.3088]] %} {% set party = [[0.6389, 0.3548], [0.2138, 0.7097], [0.3227, 0.329]] %} {% if effect == 'nye_countdown' %}
                {# Capture the OUTER index. Ten decreasing periods sum to 55 units. #}
                {% set before = (cycle_index - 1) * (22 - cycle_index) / 2 %}
                {% set period = 11 - cycle_index %}
                {{ [
                  {'colors': white, 'brightness': [255,255], 'transition': [0,0], 'hold': [0,0],
                   'until_at': started + countdown_length * (before + period / 2) / 55},
                  {'colors': white, 'brightness': [5,5], 'transition': [0,0], 'hold': [0,0],
                   'until_at': started + countdown_length * (before + period) / 55}
                ] }}
              {% elif effect == 'nye_midnight_flash' %}
                {{ [
                  {'colors': white, 'brightness': [255,255], 'transition': [0,0], 'hold': [1,1]},
                  {'colors': white, 'brightness': [120,120], 'transition': [4,4], 'hold': [4,4]}
                ] }}
              {% elif effect == 'blood' %}
                {{ [
                  {'colors': red, 'brightness': [150,199], 'transition': [0.3,0.3], 'hold': [0.3,0.3]},
                  {'colors': red, 'brightness': [20,39], 'transition': [0.4,0.4], 'hold': [0.4,0.4]},
                  {'colors': red, 'brightness': [120,159], 'transition': [0.3,0.3], 'hold': [0.3,0.3]},
                  {'colors': red, 'brightness': [5,14], 'transition': [0.8,0.8], 'hold': [2,3]}
                ] }}
              {% elif effect == 'lightning' %}
                {% set ns = namespace(frames=[{'colors': white, 'brightness': [3,9], 'transition': [1,1], 'hold': [2,3]}]) %}
                {% for flash in range(range(4,10) | random) %}
                  {% set ns.frames = ns.frames + [
                    {'colors': white, 'brightness': [255,255], 'transition': [0,0], 'hold': [0.1,0.2]},
                    {'colors': white, 'brightness': [3,9], 'transition': [0,0], 'hold': [0.2,0.6]}
                  ] %}
                {% endfor %}
                {{ ns.frames }}
              {% elif effect == 'xmas_party' %}
                {% set ns = namespace(frames=[]) %}
                {% set mode = (cycle_index - 1) % 4 %}
                {% for beat in range(8) %}
                  {% if mode == 1 %}
                    {% for color in party %}
                      {% set ns.frames = ns.frames + [{'colors': [color], 'brightness': [255,255], 'transition': [0,0], 'hold': [0.3,0.3]}] %}
                    {% endfor %}
                  {% elif mode == 3 %}
                    {% set ns.frames = ns.frames + [
                      {'colors': white, 'brightness': [20,20], 'transition': [0,0], 'hold': [0.3,0.3]},
                      {'colors': party, 'brightness': [255,255], 'transition': [0,0], 'hold': [0.7,0.7], 'solo_index': beat % (lights | length)}
                    ] %}
                  {% else %}
                    {% set colors = [party[0]] if mode == 2 else [party | random] %}
                    {% set ns.frames = ns.frames + [
                      {'colors': colors, 'brightness': [255,255], 'transition': [0,0], 'hold': [0.3,0.3]},
                      {'colors': colors, 'brightness': [150,150], 'transition': [0,0], 'hold': [0.3,0.3]}
                    ] %}
                  {% endif %}
                {% endfor %}
                {{ ns.frames }}
              {% elif effect == 'xmas_dinner' and range(10) | random < 3 %}
                {{ [
                  dict(palettes[effect], brightness=[140,169], transition=[4,5], hold=[8,11]),
                  palettes[effect]
                ] }}
              {% else %}
                {{ [palettes[effect]] }}
              {% endif %}
        - repeat:
            for_each: '{{ frames }}'
            sequence:
            - variables:
                frame: '{{ repeat.item }}'
                frame_deadline: '{% set until_at = frame.get(''until_at'', 0) %} {{ [until_at, deadline]
                  | min if until_at > 0 and deadline > 0 else until_at or deadline }}'
            - variables:
                targets: |-
                  {% set ns = namespace(targets=[]) %} {% if 'solo_index' in frame %}
                    {% set ns.targets = [[lights[frame.solo_index]]] %}
                  {% elif group_updates %}
                    {% set ns.targets = [lights] %}
                  {% else %}
                    {% for entity in lights %}{% set ns.targets = ns.targets + [[entity]] %}{% endfor %}
                  {% endif %} {{ ns.targets }}
            - repeat:
                for_each: '{{ targets }}'
                sequence:
                - action: script.holiday_atmosphere_light_step
                  data:
                    targets: '{{ repeat.item }}'
                    color: '{{ frame.colors | random }}'
                    brightness: '{{ range(frame.brightness[0], frame.brightness[1] + 1) | random }}'
                    transition: '{{ frame.transition | random }}'
                    brightness_max: '{{ brightness_max }}'
                    speed: '{{ speed }}'
                    interval_ms: '{{ interval_ms }}'
                    deadline: '{{ frame_deadline }}'
            - variables:
                hold_seconds: '{{ [frame.hold | random, frame.transition | max] | max / speed }}'
                pause_until: '{{ frame.get(''until_at'', as_timestamp(now()) + hold_seconds) }}'
            - delay:
                seconds: '{{ [[pause_until, deadline] | min - as_timestamp(now()), 0] | max if deadline
                  > 0 else [pause_until - as_timestamp(now()), 0] | max }}'
    - action: script.turn_on
      target:
        entity_id: script.holiday_atmosphere_controller
      data:
        variables:
          effect: stop
          expected_session: '{{ session_token }}'
          restore_on_stop: '{{ restore_on_stop }}'
  holiday_atmosphere_light_step:
    alias: Holiday Atmosphere Light Step
    description: Internal paced, bounded, best-effort color update (v2.1.0).
    mode: single
    sequence:
    - variables:
        available: |-
          {% set ns = namespace(lights=[]) %} {% for entity in targets %}
            {% if states(entity) not in ['unknown', 'unavailable'] %}
              {% set ns.lights = ns.lights + [entity] %}
            {% endif %}
          {% endfor %} {{ ns.lights }}
        send_frame: '{{ available | length > 0 and (deadline == 0 or as_timestamp(now()) < deadline) }}'
    - if: '{{ send_frame }}'
      then:
      - action: light.turn_on
        continue_on_error: true
        target:
          entity_id: '{{ available }}'
        data:
          brightness: '{{ [[brightness | int, brightness_max | int] | min, 1] | max }}'
          xy_color: '{{ color }}'
          transition: '{{ transition / speed }}'
    - delay:
        milliseconds: '{{ interval_ms if send_frame or deadline == 0 or as_timestamp(now()) < deadline
          else 1 }}'
  halloween_atmosphere:
    alias: 🎃 Halloween Atmosphere
    description: v2.1.0 Halloween entry point; requires the shared holiday package. One active show globally.
    mode: parallel
    max: 20
    fields:
      lights:
        description: Light entity IDs or light groups; required when starting, optional for stop.
        example: light.living_room, light.hallway, light.kitchen
        selector:
          entity:
            multiple: true
            domain: light
      effect:
        description: Which effect to play
        example: hell
        selector:
          select:
            options:
            - hell
            - lightning
            - graveyard
            - halloween
            - blood
            - stop
        required: true
      brightness_max:
        name: Brightness ceiling
        description: Maximum effect brightness (1–255); restoration is not capped.
        default: 255
        selector:
          number:
            min: 1
            max: 255
            step: 1
            mode: slider
      speed:
        name: Effect speed
        description: Ambient holds and transitions are divided by this factor; pacing and timestamp countdowns
          stay fixed.
        default: 1
        selector:
          number:
            min: 0.25
            max: 4
            step: 0.25
            mode: slider
      duration:
        name: Duration
        description: Maximum running time in seconds; 0 means unlimited (finite effects still finish).
        default: 0
        selector:
          number:
            min: 0
            max: 86400
            step: 1
            unit_of_measurement: s
            mode: box
      pacing:
        name: Command pacing
        description: 'Minimum delay after each action: conservative 1000 ms, balanced 250 ms, fast 100
          ms. Hardware reliability must be tested.'
        default: balanced
        selector:
          select:
            options:
            - conservative
            - balanced
            - fast
      gentle:
        name: Gentle mode
        description: Reject flashing effects. Choose an ambient effect.
        default: false
        selector:
          boolean: {}
      restore_on_stop:
        name: Restore on completion
        description: Automatic completion restores the original scene when true. Pass false with stop
          to deliberately discard the backup.
        default: true
        selector:
          boolean: {}
      group_updates:
        name: Send frames together
        description: Send one shared frame to all available bulbs. Integration fan-out may still introduce
          skew; not a guarantee of Zigbee groupcast.
        default: false
        selector:
          boolean: {}
    sequence:
    - if: '{{ effect | default('''') not in [''hell'', ''lightning'', ''graveyard'', ''halloween'', ''blood'',
        ''stop''] }}'
      then:
      - stop: Choose an effect from this holiday’s menu
        error: true
    - action: script.holiday_atmosphere_controller
      data:
        effect: '{{ effect }}'
        lights: '{{ lights | default([]) }}'
        brightness_max: '{{ brightness_max | default(255) }}'
        speed: '{{ speed | default(1) }}'
        duration: '{{ duration | default(0) }}'
        pacing: '{{ pacing | default(''balanced'') }}'
        gentle: '{{ gentle | default(false) }}'
        restore_on_stop: '{{ restore_on_stop | default(true) }}'
        group_updates: '{{ group_updates | default(false) }}'
  christmas_atmosphere:
    alias: 🎄 Christmas Atmosphere
    description: v2.1.0 Christmas entry point; requires the shared holiday package. One active show globally.
    mode: parallel
    max: 20
    fields:
      lights:
        description: Light entity IDs or light groups; required when starting, optional for stop.
        example: light.living_room, light.hallway, light.kitchen
        selector:
          entity:
            multiple: true
            domain: light
      effect:
        description: Which effect to play
        example: xmas_tree
        selector:
          select:
            options:
            - xmas_tree
            - xmas_snowfall
            - xmas_fireplace
            - xmas_santa
            - xmas_dinner
            - xmas_party
            - stop
        required: true
      brightness_max:
        name: Brightness ceiling
        description: Maximum effect brightness (1–255); restoration is not capped.
        default: 255
        selector:
          number:
            min: 1
            max: 255
            step: 1
            mode: slider
      speed:
        name: Effect speed
        description: Ambient holds and transitions are divided by this factor; pacing and timestamp countdowns
          stay fixed.
        default: 1
        selector:
          number:
            min: 0.25
            max: 4
            step: 0.25
            mode: slider
      duration:
        name: Duration
