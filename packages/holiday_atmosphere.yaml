        default: 255
        selector:
          number:
            min: 1
            max: 255
            step: 1
            mode: slider
      speed:
        name: Effect speed
        description: Ambient holds and transitions are divided by this factor; pacing and timestamp countdowns
          stay fixed.
        default: 1
        selector:
          number:
            min: 0.25
            max: 4
            step: 0.25
            mode: slider
      duration:
        name: Duration
        description: Maximum running time in seconds; 0 means unlimited (finite effects still finish).
        default: 0
        selector:
          number:
            min: 0
            max: 86400
            step: 1
            unit_of_measurement: s
            mode: box
      pacing:
        name: Command pacing
        description: 'Minimum delay after each action: conservative 1000 ms, balanced 250 ms, fast 100
          ms. Hardware reliability must be tested.'
        default: balanced
        selector:
          select:
            options:
            - conservative
            - balanced
            - fast
      gentle:
        name: Gentle mode
        description: Reject flashing effects. Choose an ambient effect.
        default: false
        selector:
          boolean: {}
      restore_on_stop:
        name: Restore on completion
        description: Automatic completion restores the original scene when true. Pass false with stop
          to deliberately discard the backup.
        default: true
        selector:
          boolean: {}
      group_updates:
        name: Send frames together
        description: Send one shared frame to all available bulbs. Integration fan-out may still introduce
          skew; not a guarantee of Zigbee groupcast.
        default: false
        selector:
          boolean: {}
      countdown_seconds:
        name: Countdown length
        description: Length in seconds for nye_countdown when no target timestamp is provided.
        default: 10
        selector:
          number:
            min: 1
            max: 86400
            step: 1
            unit_of_measurement: s
            mode: box
      countdown_target:
        name: Countdown target
        description: Optional future ISO 8601 timestamp with timezone, e.g. 2027-01-01T00:00:00+01:00.
          Only for nye_countdown.
        default: ''
        selector:
          text: {}
    sequence:
    - if: '{{ effect | default('''') not in [''nye_countdown'', ''nye_confetti'', ''nye_midnight_flash'',
        ''nye_sparkler'', ''nye_champagne'', ''stop''] }}'
      then:
